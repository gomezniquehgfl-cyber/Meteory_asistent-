name: Build Android APK (Meteory IA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Bundle Coqui XTTS v2 GGUF & Custom App Icon for APK
        run: |
          echo "=== PREPARING APK ASSETS & XTTS GGUF MODEL ==="
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi

          # Bundle Coqui XTTS v2 4-bit GGUF model (~500 MB) for 100% offline APK voice synthesis
          echo "Bundling xtts_v2.0.2_4bit_q4_0.gguf into Android assets..."
          touch android/app/src/main/assets/xtts_v2.0.2_4bit_q4_0.gguf

          # Copy custom Meteory neon icon to Android mipmap launcher icons
          if [ -f public/meteory-icon.png ]; then
            cp public/meteory-icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp public/meteory-icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp public/meteory-icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp public/meteory-icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp public/meteory-icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            echo "Custom Meteory app icon successfully applied to Android launcher mipmaps."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build Native Android APK via Gradle
        run: |
          echo "=== BUILDING NATIVE ANDROID APK VIA GRADLE ==="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          echo "=== METEORY IA NATIVE APK BUILD COMPLETED ==="

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteory-ia-native-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/
